# Steam performance-overlay style: compact, single-row and content-width.
[preset 2]
# Keep the order aligned with Steam's overlay:
# FPS -> frame graph -> CPU -> GPU -> VRAM -> RAM.
legacy_layout=0
horizontal=1
horizontal_stretch=0
table_columns=32

fps=1
fps_metrics=0.01,0.97
frame_timing=1
frametime=0

cpu_stats=1
cpu_temp=1
cpu_mhz=1

gpu_stats=1
gpu_temp=1

vram=1
ram=1

# Hide fields included by MangoHud's built-in horizontal preset but absent
# from the Steam overlay in the reference screenshot.
cpu_power=0
gpu_power=0
battery=0
battery_watt=0
battery_time=0

# Steam-like placement and appearance.
position=top-left
hud_no_margin=1
offset_x=0
offset_y=0
font_size=26
background_color=020202
background_alpha=0.5
alpha=1.0
round_corners=0
text_outline=0

text_color=D6D6D6
engine_color=DC9296
cpu_color=D5D18A
gpu_color=4EB97B
vram_color=4EB97B
ram_color=CBA4DD
frametime_color=32C963
horizontal_separator_color=777777
